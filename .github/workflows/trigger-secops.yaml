name: Step 1 - Verify Application Push Trigger
on:
  push:
    branches:
        - main
jobs:
  verify-push-trigger: 
    name: Verify Application Push Triggerr
    runs-on: ubuntu-latest
    steps:
      - name: Confirmation
        run: |
          echo "Application repository push"
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name}}" 
          echo "Commit SHA: ${{github.sha}}" 

